<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strokeGrad" x1="74" y1="60" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AD1FF"/>
      <stop offset="0.52" stop-color="#3B8DFF"/>
      <stop offset="1" stop-color="#1A4DDF"/>
    </linearGradient>

    <filter id="softGlow" x="20" y="20" width="472" height="472" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.6" result="blurA"/>
      <feColorMatrix in="blurA" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.44 0 0 0 0 1 0 0 0 0.45 0" result="glowA"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4" result="blurB"/>
      <feMerge>
        <feMergeNode in="glowA"/>
        <feMergeNode in="blurB"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)" stroke="url(#strokeGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- T bar -->
    <path d="M86 84H426"/>
